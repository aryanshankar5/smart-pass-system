<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Pass - BIT Mesra</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode/1.5.3/qrcode.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://cdn.jsdelivr.net/gh/davidshimjs/qrcodejs/qrcode.min.js"></script>
    <script src="app.js"></script>


</head>
<body>
    <!-- Student Login Screen -->
    <div id="student-login" class="screen active">
        <div class="login-container">
            <div class="login-card">
                <div class="logo-section">
                    <div class="logo-placeholder">
                        <img src="/image/logo.png" alt="BIT Logo" class="logo-image" style="height: 100px; width: 100px;">
                        <!-- <div class="logo-text">BIT</div> -->
                    </div>
                    <h1>Smart Pass <br>Mess System</h1>
                    <br>
                    <p>BIT Mesra - Student Portal</p>
                </div>
                
                <div class="login-form">
                    <button class="btn btn--primary btn--full-width google-login-btn" onclick="handleStudentLogin()">
                        
                        <span class="google-icon">G</span>
                        Continue with College Gmail
                    </button>
   
                </div>
            </div>
        </div>
    </div>

    <!-- Student Dashboard -->
    <div id="student-dashboard" class="screen">
        <nav class="navbar">
            <div class="nav-content">
                <button class="menu-btn" onclick="toggleMenu()">
                    <div class="hamburger">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </button>
                <div class="logo">BIT Mesra</div>
                <div class="nav-logo">
                    <img src="image/logo.png" alt="BIT Logo">
                </div>
            </div>
            
            <!-- Dropdown Menu -->
            <div id="nav-menu" class="nav-menu">
                <button class="menu-item" onclick="showProfile()">Profile</button>
                <button class="menu-item" onclick="logout()">Logout</button>
            </div>
        </nav>

        <div class="dashboard-content">
            <!-- Student Profile Card -->
            <div class="student-profile-card">
                <div class="student-info">
                    <div class="student-avatar">
                        <img id="student-photo" src="" alt="Student Photo">
                    </div>
                    <div class="student-details">
                        <h3 id="student-name"></h3>
                        <p id="student-roll"></p>
                        <p id="student-branch"></p>
                        <p id="student-hostel-room"></p>
                    </div>
                </div>
            </div>

            <!-- Location Status -->
            <div class="location-card">
                <div class="location-status" id="location-status">
                    <div class="location-icon"></div>
                    <div class="location-text">
                        <div class="location-title">Location Status</div>
                        <div class="location-subtitle" id="location-text">Checking location...</div>
                    </div>
                </div>
            </div>

            <!-- Meal Slots -->
            <div class="meal-slots-container">
                <h3>Available Meal Slots</h3>
                <div class="meal-slots" id="meal-slots">
                    <!-- Meal slot cards will be populated by JavaScript -->
                </div>
            </div>

        </div>
    </div>

    <!-- QR Generation Screen -->
    <div id="qr-screen" class="screen">
        <nav class="navbar">
            <div class="nav-content">
                <button class="back-btn" onclick="backToDashboard()">←</button>
                <div class="logo">Generate QR</div>
                <div class="nav-logo">
                    <img src="image/logo.png" alt="BIT Logo">
                </div>
            </div>
        </nav>

        <div class="qr-content">
            <div class="qr-card">
                <div class="student-profile-card qr-profile-card">
                    <div class="student-info">
                        <div class="student-avatar">
                            <img id="qr-student-photo" src="" alt="Student Photo">
                        </div>
                        <div class="student-details">
                            <h3 id="qr-student-name"></h3>
                            <p id="qr-student-roll"></p>
                            <p id="qr-student-branch"></p>
                            <p id="qr-student-hostel-room"></p>
                        </div>
                    </div>
                </div>

                <div class="meal-slot-info">
                    <div class="meal-label">Meal: <span id="qr-meal-name"></span></div>
                    <div class="qr-date" id="qr-date"></div>
                </div>

                <div class="qr-container">
                    <div id="qr-code"></div>
                </div>

                <div class="qr-timer">
                    <div class="timer-text">Expires in: <span id="timer"></span></div>
                    <div class="timer-bar">
                        <div class="timer-fill" id="timer-fill"></div>
                    </div>
                </div>

            </div>
        </div>
    </div>


    <!-- Profile Screen -->
    <div id="profile-screen" class="screen">
        <nav class="navbar">
            <div class="nav-content">
                <button class="back-btn" onclick="backToDashboard()">←</button>
                <div class="logo">Profile</div>
                <div class="nav-logo">
                    <img src="image/logo.png" alt="BIT Logo">
                </div>
            </div>
        </nav>

        <div class="qr-content">
            <div class="qr-card profile-card">
                <div class="profile-header">
                    <div class="student-avatar profile-avatar">
                        <img id="profile-photo" src="" alt="Student Photo">
                    </div>
                    <div class="student-details profile-details">
                        <h3 id="profile-name"></h3>
                        <div class="form-group form-row">
                            <label>Roll No</label>
                            <div id="profile-roll" class="readonly-field"></div>
                        </div>
                        <div class="form-group form-row">
                            <label>Branch</label>
                            <div id="profile-branch" class="readonly-field"></div>
                        </div>
                        <div class="form-group form-row">
                            <label>Batch</label>
                            <div id="profile-batch" class="readonly-field"></div>
                        </div>
                        <div class="form-group form-row">
                            <label>Year</label>
                            <div id="profile-year" class="readonly-field"></div>
                        </div>
                        <div class="form-group form-row">
                            <label>Hostel</label>
                            <div id="profile-hostel" class="readonly-field"></div>
                        </div>
                        <div class="form-group form-row">
                            <label>Hostel Room</label>
                            <div id="profile-hostel-room" class="readonly-field"></div>
                        </div>
                        <div class="form-group form-row">
                            <label>College Email</label>
                            <div id="profile-college-email" class="readonly-field"></div>
                        </div>
                    </div>
                </div>

                <div class="profile-form">
                    <label class="profile-label" for="personal-email-input">Personal Email</label>
                    <input id="personal-email-input" type="email" class="form-control profile-input" readonly onclick="enableProfileField(this)">
                    <label class="profile-label" for="personal-phone-input">Phone Number</label>
                    <input id="personal-phone-input" type="tel" class="form-control profile-input" readonly onclick="enableProfileField(this)">
                </div>

                <div class="profile-save-row">
                    <button class="btn btn--primary btn--full-width" onclick="saveProfileChanges()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div><strong>Powered by BIT Mesra</strong></div>
        <div>Developed by Aryan Shankar</div>
    </footer>
</body>
</html>
